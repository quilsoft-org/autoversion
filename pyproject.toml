[project]
name = "autoversion"
version = "1.0.11"
description = "Pre-commit hook to check Odoo module version update when XML or CSV files are modified."
authors = [
    { name = "Jorge Obiols", email = "jorge.obiols@quilsoft.com" }
]
requires-python = ">=3.10"
[project.scripts]
autoversion = "autoversion:main"
[tool.setuptools]
py-modules = ["autoversion"]