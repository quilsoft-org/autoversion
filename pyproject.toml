[project]
name = "autoversion"
version = "1.2.0"
description = "Pre-commit hook to check Odoo module version bump when any file inside a module is modified."
authors = [
    { name = "Jorge Obiols", email = "jorge.obiols@quilsoft.com" }
]
requires-python = ">=3.10"
[project.scripts]
autoversion = "autoversion:main"
[tool.setuptools]
py-modules = ["autoversion"]